<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة المالك — قفطان</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#03211b">
<link rel="icon" href="logo.jpg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css?v=8">
<link rel="stylesheet" href="css/admin.css?v=8">
</head>
<body>
<main id="login" class="login hidden">
  <div class="card">
    <img src="logo.jpg" alt="شعار KFT" width="84" height="84">
    <h1>لوحة المالك</h1>
    <p class="hint">مجمع قفطان</p>
    <form id="loginForm" novalidate>
      <label class="field"><span>اسم المستخدم</span><input class="input" id="lu" autocomplete="username" dir="ltr" autocapitalize="off" spellcheck="false"></label>
      <label class="field"><span>كلمة السر</span><input class="input" id="lp" type="password" autocomplete="current-password" dir="ltr"></label>
      <p class="err" id="lerr" role="alert"></p>
      <button class="btn btn-gold btn-block btn-lg" id="lbtn" type="submit">دخول</button>
    </form>
  </div>
</main>

<div id="app" class="app hidden">
  <header class="top">
    <div class="row">
      <img src="logo.jpg" alt="" width="38" height="38">
      <div class="title"><b>لوحة المالك</b><small id="who"></small></div>
      <a class="btn btn-ghost" href="./" target="_blank" rel="noopener" data-tip="يفتح الصفحة مثل ما يشوفها الزبون">صفحة الزبون ↗</a>
      <button class="icon-btn" id="logout" aria-label="خروج" data-tip="تسجيل خروج من اللوحة">⎋</button>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="orders" aria-selected="true" data-tip="كل الطلبات اللي وصلت وحالتها">الطلبات<span class="badge hidden" id="newBadge"></span></button>
      <button role="tab" data-tab="products" aria-selected="false" data-tip="القطع وأسعارها وصورها، وشنو متوفر وشنو خلص">المنتجات</button>
      <button role="tab" data-tab="settings" aria-selected="false" data-tip="التوصيل والخصم وإيقاف الطلبات والواتساب وكلمة السر">الإعدادات</button>
    </nav>
  </header>

  <div class="stats" id="stats"></div>
  <section id="tab-orders"></section>
  <section id="tab-products" class="hidden"></section>
  <section id="tab-settings" class="hidden"></section>
</div>

<section class="sheet editor hidden" id="eSheet" role="dialog" aria-modal="true" aria-label="تعديل منتج"></section>

<script src="js/api.js?v=8"></script>
<script src="js/admin.js?v=8"></script>
<script src="js/admin-orders.js?v=8"></script>
<script src="js/admin-products.js?v=8"></script>
<script src="js/admin-settings.js?v=8"></script>
</body>
</html>
